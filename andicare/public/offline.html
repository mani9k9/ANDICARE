<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#002b73" />
    <title>AnDiCare — You're offline</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #f7fcfd;
        color: #002b73;
      }
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }
      main {
        width: min(100%, 480px);
        padding: 42px;
        border: 1px solid #d7e5ec;
        border-radius: 24px;
        background: #ffffff;
        box-shadow: 0 16px 48px rgba(0, 43, 115, 0.1);
      }
      .mark {
        display: inline-grid;
        width: 44px;
        height: 44px;
        place-items: center;
        border-radius: 14px;
        background: #0066d6;
        color: #ffffff;
        font-size: 28px;
        font-weight: 800;
      }
      h1 {
        margin: 28px 0 12px;
        font-size: clamp(2rem, 7vw, 3rem);
        letter-spacing: -0.06em;
        line-height: 0.98;
      }
      p {
        margin: 0;
        color: #5b7183;
        font-size: 1rem;
        line-height: 1.7;
      }
      a {
        display: inline-block;
        margin-top: 28px;
        padding: 13px 18px;
        border-radius: 999px;
        background: #7acb00;
        color: #002b73;
        font-weight: 800;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="mark" aria-hidden="true">+</span>
      <h1>You're offline for now.</h1>
      <p>
        AnDiCare needs a connection for bookings, reports, and live availability.
        Reconnect and try again when you're ready.
      </p>
      <a href="./">Try again</a>
    </main>
  </body>
</html>
